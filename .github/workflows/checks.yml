name: Checks
on: [push, pull_request]
jobs:
  backend-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/host.cjs
      - run: node tests/web.cjs
      - run: node tests/build-bundle.cjs && git diff --exit-code -- openrkn-deploy.tar.gz
      - run: node --check files/www/openrkn/app.js && node --check files/www/openrkn/api.js && node --check files/www/openrkn/qr.js
